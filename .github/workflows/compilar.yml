name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          validate-wrappers: false
      - name: Generar Gradle Wrapper si falta
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          fi

      - name: Configurar local.properties
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Preparar Gradle Wrapper
        shell: bash
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Compilar APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
